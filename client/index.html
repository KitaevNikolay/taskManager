<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Стасик</title>
    <meta name="description" content="Админка задач отдела: канбан, очереди сотрудников, Гант и алерты с синхронизацией с Битрикс24" />
    <meta name="application-name" content="Стасик" />
    <meta name="apple-mobile-web-app-title" content="Стасик" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d2126" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Стасик" />
    <meta property="og:description" content="Канбан, очереди, Гант и алерты по задачам отдела из Битрикс24" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Тема до загрузки приложения, чтобы не мигало светлым
      (function () {
        var t = 'auto';
        try { t = localStorage.getItem('theme') || 'auto'; } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="apple-touch-icon" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
