services:
  app:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/app.db
      # Внутри контейнера слушаем все интерфейсы; наружу порт открыт только на localhost (для nginx)
      HOST: 0.0.0.0
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/data
      - ./backup:/app/backup
    restart: unless-stopped
